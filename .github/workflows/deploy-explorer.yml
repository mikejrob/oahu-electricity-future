name: Deploy results explorer

# Exports explorer/ (R Shiny) to a static shinylive site and publishes it on
# GitHub Pages via the gh-pages branch. Runs only in the public mirror
# repository — the working repo carries the same file via push_both.sh but
# skips the jobs.
#
# If the site does not appear after the first successful run, enable it once:
# Settings -> Pages -> Source: Deploy from a branch -> gh-pages / (root).

on:
  push:
    branches: [main]
    paths:
      - "explorer/**"
      - ".github/workflows/deploy-explorer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    if: github.repository == 'mikejrob/oahu-electricity-future'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: |
          Rscript -e 'install.packages(c("shinylive", "shiny", "bslib",
            "dplyr", "tidyr", "ggplot2", "readr", "jsonlite", "scales",
            "plotly"))'
      - name: Export shinylive site
        run: Rscript -e 'shinylive::export("explorer", "_site")'
      - name: Set page title
        run: |
          sed -i 's|<title>Shiny App</title>|<title>Oʻahu Electricity Futures — results explorer</title>|' _site/index.html
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
