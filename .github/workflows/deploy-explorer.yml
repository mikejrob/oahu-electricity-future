name: Deploy results explorer

# Exports explorer/ (R Shiny) to a static shinylive site and publishes it on
# GitHub Pages via the gh-pages branch. Runs only in the public mirror
# repository — the working repo carries the same file via push_both.sh but
# skips the jobs.
#
# If the site does not appear after the first successful run, enable it once:
# Settings -> Pages -> Source: Deploy from a branch -> gh-pages / (root).

on:
  push:
    branches: [main]
    paths:
      - "explorer/**"
      - ".github/workflows/deploy-explorer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    if: github.repository == 'mikejrob/oahu-electricity-future'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # GUARDRAIL: the package repo is pinned to a dated CRAN snapshot. The
      # site once regressed with NO repo change - a README-triggered redeploy
      # installed a newer bslib whose fillable-flex layout squeezed the cost
      # chart (see explorer/check_app_invariants.py). Latest-at-deploy-time
      # means any CRAN release can restyle the site silently. To upgrade:
      # bump the snapshot date deliberately, redeploy, and eyeball the cost
      # chart before leaving it. The date must be a PUBLISHED snapshot (the
      # same-day date may not exist yet — probe
      # https://packagemanager.posit.co/cran/__linux__/noble/<date>/src/contrib/PACKAGES
      # for HTTP 200 before bumping).
      - name: Install packages (CRAN snapshot 2026-08-10)
        run: |
          Rscript -e 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/2026-08-10"));
            install.packages(c("shinylive", "shiny", "bslib",
              "dplyr", "tidyr", "ggplot2", "readr", "jsonlite", "scales",
              "plotly"));
            v <- installed.packages()[, "Version"];
            print(v[intersect(c("shiny","bslib","shinylive","htmltools"), names(v))])'
      - name: Export shinylive site
        run: Rscript -e 'shinylive::export("explorer", "_site")'
      - name: Set page title
        run: |
          sed -i 's|<title>Shiny App</title>|<title>Oʻahu Electricity Futures — results explorer</title>|' _site/index.html
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
